<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baskaran Krishnamurthy Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap">
<style>
/* Mission Control: a left rail that doubles as a vertical roadmap, a 3D data lattice behind a moving floor grid,
   and a different loading scene and 3D entrance for every section. Palette: the ember heat-map, crimson to orange to amber to pale gold on aubergine-black. */
:root{
  --bg:#0F0509;--bg2:#1A0A12;--ink:#FBF3EE;--mut:#B9A7AB;--faint:#7C6A70;
  --line:rgba(255,226,210,.15);--glass:rgba(34,14,26,.62);
  --c1:#B3204E;--c2:#FFA62B;--c3:#FF5A3C;--c4:#FFE29A;--ok:#6EE7A8;--on:#1A0A12;
  --grad-t:linear-gradient(90deg,#FF5A3C,#FFA62B 55%,#FFE29A);--grad-b:linear-gradient(90deg,#FF5A3C,#FFA62B);
  --f-d:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;--f-b:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--f-m:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
  --h1s:clamp(2.4rem,5vw,4.15rem);--h2s:clamp(2rem,4.6vw,3.4rem);--ls:-.03em;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-b);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--c2);text-decoration:none}a:hover{color:var(--c3)}
:focus-visible{outline:2px solid var(--c2);outline-offset:3px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;pointer-events:none;scrollbar-width:thin;scrollbar-color:var(--c1) transparent;-webkit-overflow-scrolling:touch}
.panel.on{visibility:visible;opacity:1;pointer-events:auto}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-block:clamp(20px,4vw,52px) clamp(40px,6vw,72px);min-height:100%;display:flex;flex-direction:column}
.wrap.mid{justify-content:center}
.eyebrow{font:500 12px var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--c2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;font-weight:700;letter-spacing:var(--ls,-.03em)}
h1{font-size:var(--h1s,clamp(2.4rem,5vw,4.15rem));line-height:1.06}
h2{font-size:var(--h2s,clamp(2rem,4.6vw,3.4rem));line-height:1.08;margin-bottom:22px}
h3{font-size:1.15rem;letter-spacing:-.015em;line-height:1.25}
.g{background-image:var(--grad-t);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--c2)}
.lede{font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--mut);max-width:34em;margin:18px 0 0}
.mono{font-family:var(--f-m)}
.ph{background:color-mix(in srgb,var(--c2) 20%,transparent);color:var(--c4);padding:1px 7px;border-radius:6px;font:400 .92em var(--f-m)}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);padding:13px 22px;border-radius:12px;font:600 15px var(--f-b);cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);border-color:var(--c2);color:var(--ink)}
.btn.p{background:var(--grad-b);color:var(--on);border-color:transparent;box-shadow:0 8px 30px color-mix(in srgb,var(--c2) 30%,transparent)}
.btn.p:hover{color:var(--on)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tilt{position:relative;transform:perspective(900px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .2s ease-out,border-color .3s}
.tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c2) 20%,transparent),transparent 62%)}
.tilt:hover{border-color:var(--c2)}.tilt:hover::before{opacity:1}
.chip{font:500 12.5px var(--f-m);padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:center}
.term{font:500 14px var(--f-m);color:var(--mut);margin:22px 0 24px;display:flex;flex-wrap:wrap;gap:0 8px}
.term .pr{color:var(--c2)}.term .ar{color:var(--faint)}
.term .w{animation:hotw 4s infinite}.term .w:nth-of-type(2){animation-delay:1s}.term .w:nth-of-type(3){animation-delay:2s}.term .w:nth-of-type(4){animation-delay:3s}
@keyframes hotw{0%,20%,100%{color:var(--mut);text-shadow:none}8%{color:var(--c4);text-shadow:0 0 16px var(--c2)}}
.caret{width:8px;height:1.05em;background:var(--c2);align-self:center;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.metrics{display:flex;flex-wrap:wrap;gap:18px 34px;margin:28px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.metrics div{min-width:0}
.metrics dt{font:700 clamp(1.6rem,3vw,2.2rem)/1 var(--f-d);letter-spacing:-.03em}
.metrics dd{margin:6px 0 0;font:400 13px var(--f-m);color:var(--mut)}
.hero-art{position:relative;min-height:min(460px,70vw + 80px);display:grid;place-items:center;perspective:1100px}
/* about */
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(24px,5vw,64px);align-items:start}
.copy p{color:var(--mut);font-size:1.075rem;margin:0 0 16px;max-width:38em}
.copy p b{color:var(--ink);font-weight:500}
.card{padding:24px}
.prof{text-align:center}
.ring{width:128px;height:128px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));margin:4px auto 16px;animation:spin 12s linear infinite}
.ring div{width:100%;height:100%;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:700 2.4rem var(--f-d);animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{margin:18px 0 0;text-align:left;display:grid;gap:12px}
.facts div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.facts dt{font:500 12px var(--f-m);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stg{font:500 11.5px var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--c2);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.card.hot{background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 40%,transparent),var(--glass));border-color:var(--c2)}
.card.hot .stg b{font-weight:500;color:var(--on);background:var(--grad-b);padding:1px 9px;border-radius:999px;letter-spacing:.06em}
.card p{margin:8px 0 0;color:var(--mut);font-size:15px}
/* pipeline */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);align-items:stretch;margin-top:30px}
.nd{padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nd h3{font-size:1.02rem}
.nd .ic{width:30px;height:30px;color:var(--c2);filter:drop-shadow(0 0 8px var(--c2))}
.nd .stg{margin:0}.nd .chips{margin-top:4px;gap:6px}
.nd .chip{font-size:11.5px;padding:3px 9px;white-space:normal}
.nd.hot{border-color:var(--c2)}
.lnk{position:relative;align-self:center;height:2px;width:100%;background:repeating-linear-gradient(90deg,var(--c2) 0 6px,transparent 6px 12px);background-size:24px 100%;animation:flowx 1s linear infinite}
.lnk::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--c2);border-right:0}
@keyframes flowx{to{background-position:-24px 0}}
@keyframes flowy{to{background-position:0 -24px}}
.minibot{width:62px;margin:4px 0 0;align-self:flex-start;animation:bob 4.4s ease-in-out infinite}
.rack{display:grid;gap:5px;margin-top:4px}
.rack div{height:14px;border-radius:4px;border:1px solid var(--line);background:rgba(0,0,0,.4);display:flex;align-items:center;gap:5px;padding:0 6px}
.rack i{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:led 1.4s steps(2) infinite}
.rack i:nth-child(2){background:var(--c3);animation-delay:-.5s}.rack i:nth-child(3){background:var(--c1);animation-delay:-.9s}
.rack div:nth-child(2) i{animation-delay:-.3s}.rack div:nth-child(3) i{animation-delay:-.7s}
.rack div::after{content:"";margin-left:auto;width:34%;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
@keyframes led{50%{opacity:.25}}
.pts{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.pts .card{padding:20px}.pts .stg{margin:0 0 6px}
@media (max-width:1000px){
 .flow{grid-template-columns:minmax(0,1fr)}
 .lnk{width:2px;height:30px;justify-self:center;background:repeating-linear-gradient(180deg,var(--c2) 0 6px,transparent 6px 12px);background-size:100% 24px;animation-name:flowy}
 .lnk::after{right:auto;left:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top:7px solid var(--c2);border-bottom:0}
}
/* experience */
.tl{position:relative;display:grid;gap:18px;padding-left:28px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--c2),var(--c1) 60%,transparent)}
.role{position:relative;padding:22px 24px}
.role::after{content:"";position:absolute;left:-27px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--c2);box-shadow:0 0 12px var(--c2)}
.rh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.rh .when{font:500 12.5px var(--f-m);color:var(--c3);white-space:nowrap}
.co{color:var(--mut);margin:2px 0 0;font-size:15px}
.role ul{margin:12px 0 0;padding-left:18px;color:var(--mut);font-size:15px}
.role li{margin:6px 0}.role li::marker{color:var(--c2)}.role li b{color:var(--ink);font-weight:500}
.edu{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
/* projects */
.sub{margin:34px 0 14px;display:flex;align-items:center;gap:12px;font:500 12px var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--c2)}
h2+.sub{margin-top:0}
.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.pc{padding:22px;display:flex;flex-direction:column;gap:8px}
.pc .co{margin:0;font:500 12px var(--f-m);letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.pc p{margin:0;color:var(--mut);font-size:15px}.pc p:not(.co){flex:1}
.metric{align-self:flex-start;font:600 13px var(--f-m);color:var(--on);background:var(--grad-b);padding:4px 12px;border-radius:999px;margin-top:6px}
.pc.plan{border-style:dashed}.pc.plan .metric{background:none;color:var(--c4);border:1px solid var(--c2)}
.kv{margin:6px 0 0;display:grid;gap:6px;font-size:14px}
.kv div{display:grid;grid-template-columns:70px 1fr;gap:8px}
.kv dt{font:500 11.5px var(--f-m);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.kv dd{margin:0;color:var(--mut)}
/* contact */
.big{font-size:clamp(2rem,5.2vw,4rem);line-height:1.04;max-width:15em}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:30px}
.mail code{font:500 clamp(1rem,2.4vw,1.25rem) var(--f-m);color:var(--c4);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);user-select:all;word-break:break-all}
.cons{margin-top:36px;padding:18px 20px;font:400 14px/1.8 var(--f-m);color:var(--mut);max-width:30rem}
.cons .k{color:var(--c2)}.cons .s{color:var(--c4)}
.foot{margin-top:auto;padding-top:48px;font:400 12.5px var(--f-m);color:var(--faint)}
.next{margin-top:36px}
/* robot */
.bot{display:block;width:100%;height:auto;overflow:visible}
.bot .pu{transform:translate(calc(var(--ex,0)*1px),calc(var(--ey,0)*1px));transition:transform .15s ease-out}
.bot .eyes{transform-box:fill-box;transform-origin:center;animation:blink2 5.5s infinite}
@keyframes blink2{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bot .ant{animation:ping2 1.6s ease-in-out infinite}
@keyframes ping2{50%{opacity:.3}}
.bot .eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.bot .eq rect:nth-child(2){animation-delay:-.4s}.bot .eq rect:nth-child(3){animation-delay:-.8s}
@keyframes eq{50%{transform:scaleY(.35)}}
.bot .arm{transform-box:fill-box;transform-origin:50% 12%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-26deg)}}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.botw{position:absolute;width:clamp(96px,13vw,148px);z-index:3;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 12px 28px color-mix(in srgb,var(--c2) 35%,transparent))}
.say{position:absolute;left:58%;bottom:98%;min-width:158px;height:34px;font:500 12px/34px var(--f-m);color:var(--ink);padding:0 12px;background:rgba(0,0,0,.72);border:1px solid var(--c2);border-radius:12px 12px 12px 3px}
.say span{position:absolute;left:12px;opacity:0;white-space:nowrap;animation:say 9s infinite}
.say span:nth-child(2){animation-delay:3s}.say span:nth-child(3){animation-delay:6s}
@keyframes say{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
/* loaders (shared art; each design supplies the container) */
.ld{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(420px,88vw)}
.ld-art{width:100%;height:190px;position:relative;display:grid;place-items:center}
.ld-lab{margin:0;font:500 13px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--c4)}
.ld-bar{width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--grad-b);animation:fill 1.15s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
.ld-bin{display:grid;gap:3px;width:100%;overflow:hidden;font:500 12px/1.2 var(--f-m);white-space:nowrap}
.ld-bin b{font-weight:500;color:var(--c2);opacity:0;animation:binrow 1.3s ease-out forwards;animation-delay:calc(var(--i)*60ms)}
.ld-bin b:nth-child(odd){--s:-1;color:var(--c3)}.ld-bin b:nth-child(3n){color:var(--c1)}
@keyframes binrow{0%{opacity:0;transform:translateX(calc(var(--s,1)*40px))}25%{opacity:1}100%{opacity:.35;transform:translateX(calc(var(--s,1)*-30px))}}
.ld-pipe{display:flex;align-items:center;width:100%;justify-content:space-between}
.ld-pn{display:flex;flex-direction:column;align-items:center;gap:8px;font:500 11px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ld-pn i{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);animation:lit .4s forwards;animation-delay:calc(var(--i)*.32s)}
@keyframes lit{to{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 35%,transparent);box-shadow:0 0 20px var(--c2)}}
.ld-pl{position:relative;flex:1;height:2px;margin:0 6px 20px;background:repeating-linear-gradient(90deg,var(--c2) 0 6px,transparent 6px 12px);background-size:24px 100%;animation:flowx .6s linear infinite}
.ld-pl u{position:absolute;top:-5px;left:0;width:12px;height:12px;border-radius:3px;background:var(--c3);box-shadow:0 0 12px var(--c3);animation:pk .55s linear forwards;animation-delay:calc(var(--i)*.3s);opacity:0}
@keyframes pk{0%{left:0;opacity:1}100%{left:calc(100% - 12px);opacity:1}}
.ld-dash{display:grid;grid-template-columns:repeat(3,1fr) 90px;grid-template-rows:auto 1fr;gap:10px;width:100%;height:100%}
.ld-k{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.04);opacity:0;animation:pop .4s forwards;animation-delay:calc(var(--i)*.15s)}
.ld-k small{display:block;font:500 10px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.ld-k b{font:700 20px var(--f-d);color:var(--c4)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
.ld-bars{grid-column:1/4;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}
.ld-bars i{flex:1;height:var(--h);border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--c3),var(--c2) 60%,var(--c1));transform-origin:bottom;transform:scaleY(0);animation:grow .6s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:calc(.3s + var(--i)*.09s)}
@keyframes grow{to{transform:scaleY(1)}}
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.ld-donut{align-self:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c2) var(--p),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(circle 26px,transparent 98%,#000 100%);mask:radial-gradient(circle 26px,transparent 98%,#000 100%);animation:donut 1.2s ease-out forwards}
@keyframes donut{to{--p:82%}}
.ld-road{width:100%;height:100%}
.ld-road path{fill:none;stroke:var(--c2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-in-out forwards;filter:drop-shadow(0 0 6px var(--c2))}
@keyframes draw{to{stroke-dashoffset:0}}
.ld-road circle.st{fill:var(--bg);stroke:var(--c3);stroke-width:3;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:stp .35s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.26s)}
@keyframes stp{to{transform:scale(1)}}
.ld-road text{font:500 10px var(--f-m);fill:var(--mut);text-anchor:middle;opacity:0;animation:pop .4s forwards;animation-delay:calc(var(--i)*.26s + .1s)}
.ld-road .mk{fill:var(--c4);filter:drop-shadow(0 0 6px var(--c4))}
.ld-rob{position:relative;width:100%;height:100%}
.ld-rb{position:absolute;left:0;bottom:30px;width:70px;animation:walk 1.25s cubic-bezier(.45,0,.3,1) forwards}
.ld-rb .bot{animation:bob .45s ease-in-out infinite}
.ld-rb em{position:absolute;left:-6px;top:56%;width:20px;height:20px;border-radius:5px;background:var(--grad-b);box-shadow:0 0 14px var(--c2)}
@keyframes walk{to{left:calc(100% - 70px)}}
.ld-track{position:absolute;left:0;right:0;bottom:22px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--faint) 0 8px,transparent 8px 16px)}
.ld-dst{position:absolute;right:0;bottom:24px;width:38px;height:38px;border:2px dashed var(--c2);border-radius:8px}
.ld-term{margin:0;width:100%;font:500 13px/1.8 var(--f-m);color:var(--mut);text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.45)}
.ld-term span{display:block;overflow:hidden;white-space:nowrap;max-width:0;animation:type .35s steps(28) forwards;animation-delay:calc(var(--i)*.24s)}
.ld-term b{color:var(--c3);font-weight:500}.ld-term .ok{color:var(--ok)}
@keyframes type{to{max-width:40ch}}
.ld-dbs{display:flex;gap:26px;align-items:flex-end;justify-content:center;height:100%;padding-bottom:6px}
.ld-can{position:relative;width:64px;height:100px;border:2px solid var(--c2);border-radius:32px/13px;overflow:hidden;background:rgba(0,0,0,.35)}

    setTimeout(function(){a.forEach(function(x){x.cancel()});o.forEach(function(x){x.cancel()});wipe.classList.remove('run');end()},cover+20)},cover+30)}

var cv=$('#bg'),cx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(devicePixelRatio||1,2),N=innerWidth<700?34:64,P=[],tx=0,ty=0,mx=0,my=0;
